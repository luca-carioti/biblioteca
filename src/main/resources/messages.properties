home.desc.title=La nostra biblioteca
home.desc.par1=La Biblioteca Comunale di San Sostene, intitolata ai maestri di musica Loiero Giuseppe (1881-1960) e Ranieri Michele (1924-1990), e' un luogo di cultura e aggregazione aperto a tutti i cittadini. Situata nel cuore del borgo, la biblioteca offre un patrimonio librario ricco e in costante aggiornamento, grazie anche a nuove donazioni.
home.desc.par2=La biblioteca e' stata realizzata con un'attenzione particolare alla sostenibilita' ambientale, utilizzando materiali riciclati per l'allestimento degli spazi. Questo impegno per l'ecocompatibilita' si riflette anche nelle attivita' proposte, con un focus sulla promozione della lettura e della cultura nel rispetto dell'ambiente.
home.desc.par3=La Biblioteca Comunale e' un punto di riferimento per la comunita', un luogo dove trovare libri, riviste e materiali multimediali per tutte le eta' e interessi. Venite a trovarci e scoprite le nostre proposte per arricchire il vostro tempo libero e la vostra conoscenza!

